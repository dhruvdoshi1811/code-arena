# Local Kubernetes for CodeArena.
#
# Create with:  kind create cluster --config infra/kind/cluster.yaml
# Destroy with: kind delete cluster --name codearena
#
# One node is enough: what is being demonstrated is that the kubelet enforces limits and
# deadlines, which a single node does exactly as well as twenty.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: codearena

nodes:
  - role: control-plane
    # Pinned by digest, not tag. A tag can be repointed; a digest cannot.
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

    # Lets the ingress controller schedule here and bind the host ports below.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

    # Without this the ingress is only reachable from inside the container network, so
    # http://localhost:8081 would go nowhere.
    #
    # Host port 8081 rather than 80: ports 80 and 443 are commonly already held on a
    # development machine (Apache, IIS, Docker Desktop), and a cluster that refuses to
    # start because of an unrelated local service is a poor first impression. Change
    # hostPort here and INGRESS_HOST in infra/deploy.sh together.
    extraPortMappings:
      - containerPort: 80
        hostPort: 8081
        protocol: TCP
