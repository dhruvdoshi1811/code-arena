# The blast radius for untrusted code.
apiVersion: v1
kind: Namespace
metadata:
  name: codearena-exec
  labels:
    app.kubernetes.io/part-of: codearena
    # Enforce the restricted Pod Security Standard at admission.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

---
# Bounds the whole namespace, not one Job.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: codearena-exec-quota
  namespace: codearena-exec
spec:
  hard:
    pods: "24"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    count/jobs.batch: "50"

---
# Defaults and ceilings for anything that lands here.
apiVersion: v1
kind: LimitRange
metadata:
  name: codearena-exec-limits
  namespace: codearena-exec
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi

---
# Deny all ingress and egress for execution pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codearena-exec-deny-all
  namespace: codearena-exec
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: execution
  policyTypes:
    - Ingress
    - Egress
